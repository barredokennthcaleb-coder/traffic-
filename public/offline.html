<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f19">
    <meta name="robots" content="noindex, nofollow">
    <title>You're offline - Traffic System</title>
    <link rel="icon" type="image/png" href="pwa-icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="pwa-icons/apple-touch-icon.png">
    <style>
        :root {
            color-scheme: dark;
            --surface: #0f172a;
            --surface-raised: #131c2e;
            --border: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-strong: #2563eb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background:
                radial-gradient(circle at 15% 10%, rgba(37, 99, 235, 0.22), transparent 42%),
                radial-gradient(circle at 85% 90%, rgba(56, 189, 248, 0.14), transparent 46%),
                linear-gradient(160deg, #0b1329 0%, #070d1d 100%);
            color: var(--text);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .offline-card {
            width: 100%;
            max-width: 430px;
            padding: 2.1rem 1.75rem 1.75rem;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: linear-gradient(160deg, rgba(19, 28, 46, 0.96), rgba(15, 23, 42, 0.96));
            box-shadow: 0 26px 70px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .offline-logo {
            width: 78px;
            height: 78px;
            margin: 0 auto 1.1rem;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
        }

        .offline-logo img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .offline-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 48px;
            height: 48px;
            margin-bottom: 0.9rem;
            border-radius: 14px;
            background: rgba(234, 179, 8, 0.14);
            color: #facc15;
        }

        .offline-icon svg {
            width: 25px;
            height: 25px;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        p {
            margin: 0 auto;
            max-width: 330px;
            color: var(--text-muted);
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .offline-actions {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-top: 1.5rem;
        }

        .offline-retry {
            min-height: 46px;
            padding: 0.7rem 1.2rem;
            border: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-strong) 100%);
            color: #ffffff;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.38);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
            touch-action: manipulation;
        }

        .offline-retry:hover {
            box-shadow: 0 9px 24px rgba(37, 99, 235, 0.5);
            transform: translateY(-1px);
        }

        .offline-retry:active {
            transform: translateY(0) scale(0.985);
        }

        .offline-retry:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 2px;
        }

        .offline-note {
            margin-top: 1.1rem;
            font-size: 0.76rem;
            color: #64748b;
        }

        .offline-status {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            margin-top: 0.35rem;
            font-size: 0.76rem;
            font-weight: 600;
            color: #fbbf24;
        }

        .offline-status[hidden] {
            display: none;
        }

        .offline-status.is-online {
            color: #34d399;
        }

        .offline-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: currentColor;
        }

        @media (prefers-reduced-motion: reduce) {
            .offline-retry {
                transition: none;
            }
        }
    </style>
</head>
<body>
    <main class="offline-card">
        <div class="offline-logo">
            <img src="pwa-icons/icon-192.png" alt="Traffic System">
        </div>

        <span class="offline-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 2l20 20"></path>
                <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
                <path d="M5 12.5a10 10 0 0 1 4-2.4"></path>
                <path d="M15 10.1a10 10 0 0 1 4 2.4"></path>
                <path d="M2 8.8a15 15 0 0 1 4.2-2.7"></path>
                <path d="M17.8 6.1A15 15 0 0 1 22 8.8"></path>
                <circle cx="12" cy="20" r="1"></circle>
            </svg>
        </span>

        <h1>You're offline</h1>
        <p>
            This screen needs a connection to load. Check your network or Wi-Fi,
            then try again. The installed app will reopen normally once you are
            back online.
        </p>

        <div class="offline-actions">
            <button type="button" class="offline-retry" id="retryBtn">Try again</button>
        </div>

        <div class="offline-note">
            Traffic Citation &amp; Enforcement System
            <div class="offline-status" id="connectionStatus">
                <span class="offline-dot" aria-hidden="true"></span>
                <span id="connectionText">No connection</span>
            </div>
        </div>
    </main>

    <script>
        (function () {
            var retry = document.getElementById('retryBtn');
            var status = document.getElementById('connectionStatus');
            var statusText = document.getElementById('connectionText');

            function syncStatus() {
                var online = navigator.onLine;
                status.hidden = false;
                status.classList.toggle('is-online', online);
                statusText.textContent = online ? 'Connected - retrying...' : 'No connection';
            }

            retry.addEventListener('click', function () {
                retry.disabled = true;
                retry.textContent = 'Trying...';
                window.location.reload();
            });

            window.addEventListener('online', function () {
                syncStatus();
                window.setTimeout(function () {
                    window.location.reload();
                }, 400);
            });

            window.addEventListener('offline', syncStatus);
            syncStatus();

            // The service worker is the source of truth for "can we reach the
            // app"; if it answers, this page is no longer needed.
            if (navigator.onLine) {
                window.setTimeout(function () {
                    fetch(window.location.href, { method: 'HEAD', cache: 'no-store' })
                        .then(function (response) {
                            if (response && response.ok) {
                                window.location.reload();
                            }
                        })
                        .catch(function () {});
                }, 1500);
            }
        })();
    </script>
</body>
</html>
