; Production defaults for the Docker/Render image.
; Keep errors in the log instead of the browser, and allow the photo
; uploads the citation workflow needs (PHP defaults to only 2 MB).
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 120
max_input_time = 120
